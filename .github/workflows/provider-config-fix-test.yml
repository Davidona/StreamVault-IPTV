name: Provider Config Fix Test

on:
  push:
    branches:
      - fix/provider-config-migration-crash

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run provider configuration codec tests
        run: ./gradlew :data:testDebugUnitTest --tests 'com.streamvault.data.provider.ProviderConfigurationCodecTest' --tests 'com.streamvault.data.provider.ProviderConfigurationCodecMigrationTest'
