name: Provider Config Fix APK

on:
  push:
    branches:
      - fix/provider-config-migration-crash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run provider configuration tests
        run: ./gradlew --console=plain :data:testDebugUnitTest --tests 'com.streamvault.data.provider.ProviderConfigurationCodecTest' --tests 'com.streamvault.data.provider.ProviderConfigurationCodecMigrationTest'

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK produced."
            exit 1
          fi
          cp "$APK_PATH" dist/StreamVault-provider-fix-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamvault-provider-fix-debug
          path: dist/StreamVault-provider-fix-debug.apk
          if-no-files-found: error
